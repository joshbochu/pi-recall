name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Choose next package version
        id: next
        run: |
          version="$(node scripts/next-version.mjs)"
          node scripts/set-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version}"

  verify:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Apply publish version
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Verify release metadata and platform package versions
        run: node scripts/check-release.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Check native crate
        run: npm run check:native

      - name: Run tests
        run: npm test

  publish-native:
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            cargo-target: aarch64-apple-darwin
            runs-on: macos-14
          - target: darwin-x64
            cargo-target: x86_64-apple-darwin
            runs-on: macos-14
          - target: linux-x64-gnu
            cargo-target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: linux-arm64-gnu
            cargo-target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: win32-x64-msvc
            cargo-target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@latest

      - name: Apply publish version
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Add Rust target
        run: rustup target add ${{ matrix.cargo-target }}

      - name: Install aarch64 cross linker
        if: matrix.target == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build platform package
        run: node scripts/pack-platform.mjs ${{ matrix.target }} ${{ matrix.cargo-target }}

      # New platform packages cannot be created via OIDC alone. Prefer NPM_TOKEN when
      # present (first bootstrap); otherwise clear the setup-node placeholder so OIDC
      # trusted publishing works for packages that already exist.
      - name: Publish platform package
        id: publish
        continue-on-error: true
        working-directory: npm/${{ matrix.target }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Report platform publish result
        if: steps.publish.outcome != 'success'
        run: |
          echo "::warning::Could not publish @joshbochu/pi-recall-native-${{ matrix.target }}@${{ needs.version.outputs.version }}."
          echo "For a first-time platform package, add an npm automation/granular token as the NPM_TOKEN repo secret,"
          echo "or publish once manually and configure a trusted publisher for publish.yml. Root publish will continue."

  publish:
    needs: [version, verify, publish-native]
    if: always() && needs.version.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@latest

      - name: Apply publish version
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Pin any prebuilt addons published above
        run: node scripts/stamp-prebuilt-deps.mjs --published-only

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  finalize:
    needs: [version, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Record published version in git
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json native/Cargo.toml
          if git diff --staged --quiet; then
            echo "version files already at ${VERSION}"
          else
            git commit -m "release: v${VERSION}"
            git push origin HEAD:main
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
